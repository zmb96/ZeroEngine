name: ZeroEngine
version: '${version}'

main: cn.ZeroEngine.Engine.api.v1.main
api-version: '1.21.5'
load: POSTWORLD
softdepend: [Vault, Essentials, EssentialsX]

commands:
  servermanagement:
    description: r
    usage: /servermanagement reload
    aliases: [sm, svm]
    permission: servermanagement.use
  ty:
    description: r
    usage: /ty <YiJian>
  ru:
    description: r
    usage: /ru
  sh:
    description: r
    usage: /sh
  giveit:
    description: r
    usage: /giveit
  sfenchant:
    description: SF 附魔系统
    usage: /sfenchant <list|apply|book|remove|info|help>
    aliases: [sfe, sfen]
    permission: sf.admin.enchant
  sfitem:
    description: SF 物品系统
    usage: /sfitem <list|give|info|hand|reload|help>
    aliases: [sfi]
    permission: sf.admin.item
  sfentity:
    description: SF 自定义生物系统
    usage: /sfentity <list|spawn|info|count|cleanup|reload|help>
    aliases: [sfe]
    permission: sf.admin.entity
  sfchat:
    description: SF 聊天系统
    usage: /sfchat <channel|mute|unmute|muteinfo|block|unblock|blocklist|clear|help>
    aliases: [sfc]
  sfworld:
    description: SF 世界管理
    usage: /sfworld <time|day|night|weather|difficulty|pvp|border|mob|fire|preset|info|list|help>
    aliases: [sfw]
    permission: sf.admin.world
  sfperm:
    description: SF 权限系统
    usage: /sfperm <group|set|addperm|rmperm|info|list|help>
    aliases: [sfp]
    permission: sf.admin.permission
  sfreach:
    description: SF 交互距离
    usage: /sfreach <info|set|add|reset|help>
    aliases: [sfre]
  sfperf:
    description: SF 性能优化系统
    usage: /sfperf <status|tps|mem|gc|chunks|entities|toggle|help>
    aliases: [sfpf]
    permission: sf.admin.perf

permissions:
  servermanagement.use:
    description: r
    default: op
  servermanagement.reload:
    description: r
    default: op
  sf.admin.enchant:
    description: SF 附魔系统
    default: op
  sf.admin.item:
    description: SF 物品系统
    default: op
  sf.admin.entity:
    description: SF 自定义生物系统
    default: op
  sf.admin.world:
    description: 世界管理
    default: op
  sf.admin.chat:
    description: 聊天管理
    default: op
  sf.admin.permission:
    description: 权限管理
    default: op
  sf.admin.reach:
    description: 交互距离管理
    default: op
  sf.admin.perf:
    description: 性能优化系统
    default: op
